<!DOCTYPE html>
<html lang="en">

<head>

{% load static %}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PoojaConnect – Library</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= BASIC ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#ffffff;
color:#111827;
}

/* ================= NAVBAR ================= */

.header-nav{
background:white;
border-bottom:1px solid #e5e7eb;
padding:0.6rem 1rem;
position:sticky;
top:0;
z-index:50;
}

.nav-container{
max-width:1280px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo-text{
font-size:1.5rem;
font-weight:700;
background:linear-gradient(135deg,#f97316,#d97706);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.logo-text a{
text-decoration:none;
}

.nav-links{
display:flex;
align-items:center;
gap:2rem;
}

.nav-links a{
text-decoration:none;
font-weight:500;
color:#1f2937;
}

.nav-links a:hover{
color:#f97316;
}

/* PROFILE */

.profile-wrapper{
position:relative;
}

.profile-icon{
width:42px;
height:42px;
border-radius:50%;
overflow:hidden;
cursor:pointer;
border:1px solid #e5e7eb;
}

.profile-icon img{
width:100%;
height:100%;
object-fit:cover;
}

.dropdown{
position:absolute;
right:0;
top:55px;
background:white;
border:1px solid #e5e7eb;
border-radius:10px;
width:220px;
display:none;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.dropdown a{
display:block;
padding:0.8rem 1rem;
text-decoration:none;
color:#374151;
}

.dropdown a:hover{
background:#f9fafb;
color:#f97316;
}

.show{
display:block;
}

/* ================= HEADER ================= */

.page-header{
background:linear-gradient(135deg,#0f172a,#2d1a3c);
color:white;
text-align:center;
padding:3rem 1rem;
}

.page-header h1{
font-size:2.3rem;
}

.page-header p{
opacity:0.9;
}

/* ================= CATEGORY ================= */

.categories{
display:flex;
justify-content:center;
gap:1rem;
margin:2rem 1rem;
flex-wrap:wrap;
}

.cat-btn{
padding:0.5rem 1.4rem;
border:1px solid #e5e7eb;
background:white;
border-radius:2rem;
cursor:pointer;
font-weight:500;
}

.cat-btn.active{
background:#f97316;
color:white;
}

/* LANGUAGE TOGGLE */

.lang-toggle{
text-align:center;
margin-top:10px;
}

.lang-toggle button{
padding:6px 12px;
margin:5px;
border:none;
border-radius:20px;
cursor:pointer;
background:#e5e7eb;
}

.lang-toggle button.active{
background:#f97316;
color:white;
}

/* ================= GRID ================= */

.grid{
max-width:1200px;
margin:auto;
padding:1rem;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:1.5rem;
}

/* ================= CARD ================= */

.card{
border:1px solid #e5e7eb;
border-radius:1rem;
overflow:hidden;
background:white;
box-shadow:0 4px 8px rgba(0,0,0,0.05);
cursor:pointer;
transition:0.2s;
}

.card:hover{
transform:translateY(-3px);
}

.card img{
width:100%;
height:170px;
object-fit:cover;
}

.card-body{
padding:1rem;
}

.card-title{
font-size:1.1rem;
font-weight:600;
}

.card-desc{
font-size:0.9rem;
color:#6b7280;
margin-top:0.4rem;
}

/* ================= MODAL ================= */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
z-index:100;
}

.modal-box{
background:white;
width:90%;
max-width:700px;
border-radius:1rem;
padding:2rem;
max-height:90vh;
overflow:auto;
white-space:pre-line;
}

.close-btn{
float:right;
cursor:pointer;
font-size:1.5rem;
color:#ef4444;
}

.modal h2{
margin-bottom:1rem;
color:#f97316;
}

.modal p{
line-height:1.7;
color:#374151;
}

</style>

</head>

<body>

<header class="header-nav">
<div class="nav-container">

<div class="logo-text">
<a href="{% url 'home' %}"><u>PoojaConnect</u></a>
</div>

<div class="nav-links">
<a href="{% url 'home' %}">Home</a>
<a href="{% url 'puja' %}">Puja</a>
<a href="{% url 'temples' %}">Temple</a>
<a href="{% url 'library' %}">Library</a>
<a href="{% url 'astrology' %}">Astrology</a>
<a href="{% url 'help' %}">Help</a>

<div class="profile-wrapper">

<div id="profileDropdown" class="dropdown">

<a href="{% url 'user_login' %}">Login as User</a>
<a href="{% url 'pandit_register' %}">Register as Pandit</a>
<a href="{% url 'pandit_login' %}">Login as Pandit</a>
</div>
</div>

</div>
</div>
</header>

<section class="page-header">
<h1>Spiritual Library</h1>
<p>Aarti • Chalisa • Mantra • Bhajan</p>
</section>

<div class="lang-toggle">
<button onclick="setLang('en')" class="active" id="btn-en">English</button>
<button onclick="setLang('hi')" id="btn-hi">Hindi</button>
</div>

<div class="categories">
<button class="cat-btn active" onclick="filterItems('all')">All</button>
<button class="cat-btn" onclick="filterItems('aarti')">Aarti</button>
<button class="cat-btn" onclick="filterItems('chalisa')">Chalisa</button>
<button class="cat-btn" onclick="filterItems('mantra')">Mantra</button>
<button class="cat-btn" onclick="filterItems('bhajan')">Bhajan</button>
</div>

<div class="grid" id="contentGrid"></div>

<div class="modal" id="detailModal">
<div class="modal-box">
<span class="close-btn" onclick="closeModal()">✖</span>
<h2 id="modalTitle"></h2>
<p id="modalContent"></p>
</div>
</div>

राम दूत अतुलित बल धामा।

अंजनि-पुत्र पवनसुत नामा।।


महाबीर बिक्रम बजरंगी।

कुमति निवार सुमति के संगी।।


कंचन बरन बिराज सुबेसा।

कानन कुण्डल कुँचित केसा।।


हाथ बज्र औ ध्वजा बिराजे।

कांधे मूंज जनेउ साजे।।


शंकर सुवन केसरी नंदन।

तेज प्रताप महा जग वंदन।।


बिद्यावान गुनी अति चातुर।

राम काज करिबे को आतुर।।


प्रभु चरित्र सुनिबे को रसिया।

राम लखन सीता मन बसिया।।


सूक्ष्म रूप धरि सियहिं दिखावा।

बिकट रूप धरि लंक जरावा।।


भीम रूप धरि असुर संहारे।

रामचन्द्र के काज संवारे।।


लाय सजीवन लखन जियाये।

श्री रघुबीर हरषि उर लाये।।


रघुपति कीन्ही बहुत बड़ाई।

तुम मम प्रिय भरतहि सम भाई।।


सहस बदन तुम्हरो जस गावैं।

अस कहि श्रीपति कण्ठ लगावैं।।


सनकादिक ब्रह्मादि मुनीसा।

नारद सारद सहित अहीसा।।


जम कुबेर दिगपाल जहां ते।

कबि कोबिद कहि सके कहां ते।।


तुम उपकार सुग्रीवहिं कीन्हा।

राम मिलाय राज पद दीन्हा।।


तुम्हरो मंत्र बिभीषन माना।

लंकेश्वर भए सब जग जाना।।


जुग सहस्र जोजन पर भानु।

लील्यो ताहि मधुर फल जानू।।


प्रभु मुद्रिका मेलि मुख माहीं।

जलधि लांघि गये अचरज नाहीं।।


दुर्गम काज जगत के जेते।

सुगम अनुग्रह तुम्हरे तेते।।


राम दुआरे तुम रखवारे।

होत न आज्ञा बिनु पैसारे।।


सब सुख लहै तुम्हारी सरना।

तुम रच्छक काहू को डर ना।।


आपन तेज सम्हारो आपै।

तीनों लोक हांक तें कांपै।।


भूतपिसाच निकट नहिं आवै।

महाबीर जब नाम सुनावै।।


नासै रोग हरे सब पीरा।

जपत निरन्तर हनुमत बीरा।।


संकट तें हनुमान छुड़ावै।

मन क्रम बचन ध्यान जो लावै।।


सब पर राम तपस्वी राजा।

तिन के काज सकल तुम साजा।।


और मनोरथ जो कोई लावै।

सोई अमित जीवन फल पावै।।


चारों जुग परताप तुम्हारा।

है परसिद्ध जगत उजियारा।।


साधु संत के तुम रखवारे।

असुर निकन्दन राम दुलारे।।


अष्टसिद्धि नौ निधि के दाता।

अस बर दीन जानकी माता।।


राम रसायन तुम्हरे पासा।

सदा रहो रघुपति के दासा।।


तुह्मरे भजन राम को पावै।

जनम जनम के दुख बिसरावै।।


अंत काल रघुबर पुर जाई।

जहां जन्म हरिभक्त कहाई।।


और देवता चित्त न धरई।

हनुमत सेइ सर्ब सुख करई।।


संकट कटै मिटै सब पीरा।

जो सुमिरै हनुमत बलबीरा।।


जय जय जय हनुमान गोसाईं।

कृपा करहु गुरुदेव की नाईं।।


जो सत बार पाठ कर कोई।

छूटहि बन्दि महा सुख होई।।


जो यह पढ़ै हनुमान चालीसा।

होय सिद्धि साखी गौरीसा।।


तुलसीदास सदा हरि चेरा।

कीजै नाथ हृदय महं डेरा।।

दोहा

पवनतनय संकट हरन, मंगल मूरति रूप।

राम लखन सीता सहित, हृदय बसहु सुर भूप।।`

let current="all";

function loadItems(){
const grid=document.getElementById("contentGrid");
grid.innerHTML="";

libraryDB.forEach(item=>{
if(current==="all"||item.category===current){
grid.innerHTML+=`
<div class="card" onclick="openDetail(${item.id})">
<img src="${item.img}">
<div class="card-body">
<div class="card-title">${currentLang==="en"?item.title_en:item.title_hi}</div>
<div class="card-desc">${item.desc}</div>
</div>
</div>`;
}
});
}

loadItems();

function filterItems(cat){
current=cat;
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
loadItems();
}

function openDetail(id){
let item=libraryDB.find(i=>i.id===id);

document.getElementById("modalTitle").innerText=
currentLang==="en"?item.title_en:item.title_hi;

document.getElementById("modalContent").innerText=
currentLang==="en"?item.content_en:item.content_hi;

document.getElementById("detailModal").style.display="flex";
}

function closeModal(){
document.getElementById("detailModal").style.display="none";
}

function toggleDropdown(){
document.getElementById("profileDropdown").classList.toggle("show");
}

window.onclick=function(e){
if(!e.target.closest('.profile-wrapper')){
document.getElementById("profileDropdown").classList.remove("show");
}
}

</script>

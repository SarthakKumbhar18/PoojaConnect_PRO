<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Appointment - PoojaConnect</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: linear-gradient(135deg, #fff7ed, #fde68a);
}

/* CONTAINER */
.container {
    max-width: 700px;
    margin: 60px auto;
    padding: 20px;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #7c2d12, #b45309);
    padding: 25px 30px;
    border-radius: 18px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

.header h2 {
    font-size: 20px;
}

.cancel-btn {
    text-decoration: none;
    background: #f97316;
    padding: 8px 16px;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    font-weight: 500;
}

.cancel-btn:hover {
    background: #ea580c;
}

/* EDIT CARD */
.edit-card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(249,115,22,0.15);
    border: 1px solid #fed7aa;
}

/* TITLE */
.card-title {
    font-size: 22px;
    font-weight: 600;
    color: #7c2d12;
    margin-bottom: 10px;
}

.card-sub {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 25px;
}

/* FORM */
form p {
    margin-bottom: 18px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #fed7aa;
    outline: none;
    font-size: 14px;
}

input:focus, select:focus, textarea:focus {
    border-color: #f97316;
}

/* BUTTONS */
.button-group {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}

.update-btn {
    flex: 1;
    padding: 14px;
    background: linear-gradient(135deg, #15803d, #166534);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.update-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 25px rgba(21,128,61,0.3);
}

.cancel-link {
    flex: 1;
    text-align: center;
    padding: 14px;
    border-radius: 14px;
    text-decoration: none;
    background: #e5e7eb;
    color: #374151;
    font-weight: 600;
}

.cancel-link:hover {
    background: #d1d5db;
}

/* Responsive */
@media(max-width: 768px) {
    .container {
        margin: 30px 15px;
    }

    .button-group {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h2>✏️ Edit Appointment</h2>
        <a href="{% url 'user_dashboard' %}" class="cancel-btn">
            ← Back to Dashboard
        </a>
    </div>

    <!-- EDIT CARD -->
    <div class="edit-card">

        <div class="card-title">
            Modify Your Booking
        </div>

        <div class="card-sub">
            Update your service details, date or time before confirmation.
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="button-group">
                <button type="submit" class="update-btn">
                    Update Appointment
                </button>

                <a href="{% url 'user_dashboard' %}" class="cancel-link">
                    Cancel
                </a>
            </div>
        </form>

    </div>

</div>

</body>
</html>
